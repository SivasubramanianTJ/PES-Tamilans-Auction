info:
  name: Create Player
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:4000/api/players
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "Virat Kohli",
        "phoneNumber": "9876543210"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
