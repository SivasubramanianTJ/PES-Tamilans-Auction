info:
  name: Import Players Check
  type: http
  seq: 2

http:
  method: POST
  url: import.meta.env.VITE_API_URL/api/players/import
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: multipart-form
    data:
      - name: file
        type: text
        value: File
        contentType: players.xlsx
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
