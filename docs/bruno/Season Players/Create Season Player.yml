info:
  name: Create Season Player
  type: http
  seq: 1

http:
  method: POST
  url: import.meta.env.VITE_API_URL/api/season-players
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "playerId": "5d529f08-da8d-48b5-ae33-e2a493983243",
        "basePrice": 2000000,
        "isRetentionEligible": true,
        "isRTMEligible": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
