info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: import.meta.env.VITE_API_URL/api/auth/login
  body:
    type: json
    data: |-
      {
        "username": "superadmin",
        "password": "Admin@123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.body.data.token;
        bru.setVar("token", token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
