info:
  name: Finish Player Sold
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:4000/api/live-auction/finish-player
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "sold": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
