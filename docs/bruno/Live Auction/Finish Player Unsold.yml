info:
  name: Finish Player Unsold
  type: http
  seq: 8

http:
  method: POST
  url: import.meta.env.VITE_API_URL/api/live-auction/finish-player
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "sold": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
